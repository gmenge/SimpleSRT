name: Verificacao

on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

jobs:
  compilacao:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build SimpleSRT.App.csproj --configuration Release
